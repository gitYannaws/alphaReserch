<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sales Safari">
  <!-- A lens with a pin in it: the pipeline hunts for a pain in a place.
       No background plate. At 16px a plate eats about half the width and the mark inside
       it goes muddy; on a transparent ground the orange gets the whole box. Two thick
       strokes and one dot is all that survives at tab size. -->
  <circle cx="13" cy="13" r="8.5" fill="none" stroke="#f2734e" stroke-width="4"/>
  <circle cx="13" cy="13" r="3" fill="#f2734e"/>
  <path d="M19.5 19.5 28.5 28.5" stroke="#f2734e" stroke-width="5" stroke-linecap="round"/>
</svg>
